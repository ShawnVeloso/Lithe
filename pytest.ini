[pytest]
# testpaths keeps collection inside tests/ — the repo root contains
# test_gemini.py, a manual live-API diagnostic with no assertions that bare
# `pytest` would otherwise import (and which would hit the network).
testpaths = tests

# Makes `pytest` work as well as `python -m pytest`. Without this the suite
# only ran via `python -m pytest` from the repo root, because pytest puts
# tests/ on sys.path rather than the project root, so `from src.backend...`
# failed. Built into pytest 7+; no plugin required.
pythonpath = .

markers =
    eval: opt-in live-LLM capability evaluation (needs LITHE_EVAL=1 and a Gemini key)
    live: test is permitted to make real network calls

# -m "not eval" keeps the live suite out of every normal run; passing -m eval on
# the command line overrides it. -rxX reports xfailed/xpassed in the summary, so
# a plain run prints the list of known, deliberately-unfixed defects.
addopts = -m "not eval" -rxX
